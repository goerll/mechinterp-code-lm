[project]
name = "mechinterp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch==2.6.0",
  "transformers==4.57.6",
  "transformer-lens==2.17.0",
  "typeguard==4.5.1",
  "einops==0.8.2",
  "numpy==1.26.4",
  "pandas==2.3.3",
  "matplotlib==3.10.8",
  "jupyter==1.1.1",
  "ipykernel==7.2.0",
  "tqdm==4.67.3",
]

[tool.uv]
managed = true

# Use CPU-only PyTorch wheels for torch/torchvision
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "modal>=1.4.1",
]
